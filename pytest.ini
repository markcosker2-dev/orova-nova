[pytest]
# Collection is restricted to tests/ — the same thing CI runs
# (.github/workflows/ci.yml: `pytest tests/ --maxfail=3 -q`), so a bare
# `pytest` at the repo root now behaves identically to CI instead of diverging.
#
# Why this is the fix rather than a marker tweak (audit B4, 2026-07-26): the
# repo root holds manual smoke scripts NAMED like tests. test_free_orova.py has
# a main() runner and two `async def` checks that error under plain pytest, and
# test_auth.py has no test functions at all — it fires httpx requests at
# http://127.0.0.1:18790 as module-level side effects, so merely COLLECTING it
# attempts live network calls. Neither was ever meant to be collected; both were
# invisible to CI and so quietly rotted.
#
# Run them deliberately if you want them: `pytest test_free_orova.py`, or
# `python test_free_orova.py` for its own main().
testpaths = tests
