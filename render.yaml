services:
  - type: web
    name: orova-nova
    runtime: docker
    plan: free
    region: ohio
    envVars:
      - key: DASHBOARD_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///app/app/data/orova_v5.db
      - key: DATA_DIR
        value: /app/app/data
      - fromContext: OLLAMA_AUTH_TOKEN
      - fromContext: TELEGRAM_BOT_TOKEN
      - fromContext: TAVILY_API_KEY
      - fromContext: RETELL_API_KEY
      - fromContext: MAKE_NOTION_WEBHOOK_URL
      - fromContext: NOTION_TOKEN
      - fromContext: NOTION_DATABASE_ID
      - fromContext: OROVA_SECRET
      - fromContext: BROWSERLESS_API_KEY
      - fromContext: APOLLO_API_KEY
      - fromContext: SERPAPI_KEY
      - fromContext: FIRECRAWL_API_KEY
      - fromContext: GOOGLE_API_KEY
    healthCheckPath: /health
