name: Deploy to Render

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY/RENDER_SERVICE_ID not set — skipping. Render already auto-deploys from main; set these secrets only if you also want this workflow to trigger a deploy."
            exit 0
          fi

          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          response=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')

          echo "$response"
          if echo "$response" | grep -q '"id"'; then
            echo "Render deploy triggered successfully."
          else
            echo "Render deploy failed." >&2
            exit 1
          fi
