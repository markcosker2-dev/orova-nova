name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      # Runs BEFORE the tests: a committed credential is an incident, and the
      # answer to "the tests were slow so I skipped the scan" must be that the
      # scan already ran. The live DASHBOARD_API_KEY was committed to this
      # PUBLIC repo in 7 files across 24 commits before this gate existed.
      - name: Secret scan
        run: |
          python scripts/check_secrets.py

      - name: Run unit tests
        run: |
          python -m pytest tests/ --maxfail=3 -q
